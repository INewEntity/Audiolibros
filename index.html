/* ---------- objetivo de hoy (tarjeta de la biblioteca) ---------- */
function renderToday() {
  const el = $('#today'); if (!el) return;
  el.classList.toggle('hidden', !books.length);
  const v = stats.days[dayKey()] || 0, p = Math.min(100, v / goalSec() * 100), done = v >= goalSec(), st = streak();
  el.classList.toggle('done', done);
  el.innerHTML = `<div class="ring" style="--p:${p}%"><i>${done ? '✓' : '🎯'}</i></div><div><div class="tt"></div><div class="ts"></div></div>`;
  el.querySelector('.tt').textContent = done ? `Objetivo de hoy cumplido · ${Math.round(v / 60)} min` : `Hoy ${Math.floor(v / 60)} de ${goalMin()} min`;
  el.querySelector('.ts').textContent = st ? `🔥 Racha de ${st} ${st === 1 ? 'día' : 'días'}${done ? '' : ' · escucha para mantenerla'}` : 'Cumple el objetivo para empezar una racha';
  renderWeekBanner();
}
$('#today').onclick = () => openStats();

/* ---------- semanas (de lunes a domingo) ---------- */
function weekStart(offset = 0) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7 + offset * 7);
  return d;
}
function weekData(offset = 0) {
  const start = weekStart(offset), days = [];
  for (let k = 0; k < 7; k++) { const d = new Date(start); d.setDate(start.getDate() + k); days.push({d, v: stats.days[dayKey(d)] || 0}); }
  const from = new Date(start); from.setHours(0, 0, 0, 0);
  const to = new Date(from); to.setDate(from.getDate() + 7);
  const inWeek = t => t >= from.getTime() && t < to.getTime();
  let notes = 0, questions = 0, recaps = 0;
  for (const b of books) {
    notes += (b.marks || []).filter(m => m.note && inWeek(m.date || 0)).length;
    for (const n of b.notes || []) if (inWeek(n.date || 0)) n.type === 'qa' ? questions++ : recaps++;
  }
  return {start, days, secs: days.reduce((a, x) => a + x.v, 0), met: days.filter(x => x.v >= goalSec()).length,
    notes, questions, recaps, future: days.filter(x => x.d > new Date()).length};
}
const weekLabel = w => { const e = new Date(w.start); e.setDate(e.getDate() + 6);
  return `${w.start.getDate()} ${w.start.toLocaleDateString('es', {month: 'short'})} – ${e.getDate()} ${e.toLocaleDateString('es', {month: 'short'})}`; };
/* el lunes aparece una vez el resumen de la semana que acaba de terminar */
function renderWeekBanner() {
  const el = $('#weekBanner'), last = weekData(-1), key = dayKey(weekStart(0));
  const show = books.length && stats.weekSeen !== key && last.secs >= 60;
  el.classList.toggle('hidden', !show);
  if (!show) return;
  el.innerHTML = '<b>Tu semana pasada</b><p></p><div class="acts"></div>';
  el.querySelector('p').textContent = `${human(last.secs)} escuchados · ${last.met} de 7 días cumplidos · ${last.notes} ${last.notes === 1 ? 'nota guardada' : 'notas guardadas'}`;
  const dismiss = () => { stats.weekSeen = key; saveStats(); el.classList.add('hidden'); };
  el.querySelector('.acts').append(pillBtn('', 'Ver resumen', () => { dismiss(); openStats(-1); }), pillBtn('', 'Cerrar', dismiss));
}

/* ---------- estadísticas: hoy, objetivo, racha y resumen semanal ---------- */
function openStats(offset = 0) {
  trackListening(); saveStats();
  let total = 0;
  for (const v of Object.values(stats.days)) total += v;
  sheet('Estadísticas', body => {
    const today = stats.days[dayKey()] || 0;
    const g = document.createElement('div'); g.className = 'stats';
    const st = streak(), best = bestStreak();
    for (const [v, l] of [[`${Math.floor(today / 60)}/${goalMin()} min`, today >= goalSec() ? 'hoy ✓' : 'hoy'],
                          [st + (st === 1 ? ' día' : ' días'), 'racha actual'], [best + (best === 1 ? ' día' : ' días'), 'mejor racha']]) {
      const s = document.createElement('div'); s.className = 'stat';
      const b = document.createElement('b'); b.textContent = v; const sp = document.createElement('span'); sp.textContent = l;
      s.append(b, sp); g.append(s);
    }
    body.append(g);

    // objetivo diario
    const gt = document.createElement('div'); gt.className = 'chaph'; gt.textContent = 'Objetivo diario';
    const chips = document.createElement('div'); chips.className = 'chips';
    for (const m of GOAL_OPTIONS) {
      const c = document.createElement('button'); c.className = 'chip' + (m === goalMin() ? ' on' : ''); c.textContent = m + ' min';
      c.onclick = () => { stats.goal = m; saveStats(); renderToday(); openStats(offset); };
      chips.append(c);
    }
    const gh = document.createElement('div'); gh.className = 'hint';
    gh.textContent = `Un día cuenta como cumplido cuando escuchas al menos ${goalMin()} minutos. La racha son los días cumplidos seguidos; si cambias el objetivo, se recalcula.`;
    body.append(gt, chips, gh);

    // resumen semanal
    const wt = document.createElement('div'); wt.className = 'chaph'; wt.textContent = 'Resumen semanal';
    const seg = document.createElement('div'); seg.className = 'seg';
    for (const [o, l] of [[0, 'Esta semana'], [-1, 'Semana pasada']]) {
      const b = document.createElement('button'); b.textContent = l; b.className = o === offset ? 'on' : '';
      b.onclick = () => openStats(o); seg.append(b);
    }
    const w = weekData(offset), prev = weekData(offset - 1);
    const range = document.createElement('div'); range.className = 'hint'; range.style.paddingBottom = '4px'; range.textContent = weekLabel(w);
    const ws = document.createElement('div'); ws.className = 'stats';
    const pct = prev.secs ? Math.round((w.secs - prev.secs) / prev.secs * 100) : null;
    for (const [v, l, extra] of [[human(w.secs), 'escuchados', pct], [`${w.met}/${7 - w.future}`, 'días cumplidos'], [String(w.notes), w.notes === 1 ? 'nota guardada' : 'notas guardadas']]) {
      const s = document.createElement('div'); s.className = 'stat';
      const b = document.createElement('b'); b.textContent = v; const sp = document.createElement('span'); sp.textContent = l;
      s.append(b, sp);
      if (extra != null && extra !== 0) { const dd = document.createElement('div'); dd.className = 'delta ' + (extra > 0 ? 'up' : 'down'); dd.textContent = `${extra > 0 ? '+' : ''}${extra} % vs anterior`; s.append(dd); }
      ws.append(s);
    }
    // barras de lunes a domingo; en color los días cumplidos; línea discontinua = objetivo
    const max = Math.max(goalSec() * 1.25, ...w.days.map(x => x.v));
    const wk = document.createElement('div'); wk.className = 'week';
    const line = document.createElement('span'); line.className = 'goal-line'; line.style.bottom = (goalSec() / max * 90 + 17) + 'px'; wk.append(line);
    const todayKey = dayKey();
    w.days.forEach(({d, v}) => {
      const c = document.createElement('div');
      if (v >= goalSec()) c.classList.add('met');
      if (dayKey(d) === todayKey) c.classList.add('today');
      const bar = document.createElement('i'); bar.style.height = Math.max(3, v / max * 90) + 'px'; bar.title = human(v);
      const l = document.createElement('span'); l.textContent = 'DLMXJVS'[d.getDay()];
      c.append(bar, l); wk.append(c);
    });
    const extra = document.createElement('div'); extra.className = 'hint';
    extra.textContent = `También ${w.questions} ${w.questions === 1 ? 'pregunta' : 'preguntas'} al libro y ${w.recaps} ${w.recaps === 1 ? 'resumen' : 'resúmenes'}. En total has escuchado ${human(total)}.`;
    body.append(wt, seg, range, ws, wk, extra);

    const per = books.filter(b => b.listened > 30).sort((a, b) => b.listened - a.listened);
    if (per.length) {
      const t = document.createElement('div'); t.className = 'chaph'; t.textContent = 'Por libro'; body.append(t);
      per.forEach(b => body.append(row(b.title.length > 34 ? b.title.slice(0, 34) + '…' : b.title, () => {}, '', human(b.listened))));
    }
  });
}

/* ---------- nota rápida: guarda una idea en el minuto exacto del audio ---------- */
$('#quickNote').onclick = () => {
  if (!cur) return;
  const t = audio.currentTime, i = chapterIndex(t), chapter = i >= 0 ? chapters()[i].title : '';
  const wasPlaying = !audio.paused; audio.pause();
  const resume = () => { closeSheet(); if (wasPlaying) audio.play().catch(() => {}); };
  sheet('Nota rápida · ' + fmt(t), body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = (chapter ? chapter + ' · ' : '') + 'minuto ' + fmt(t) + '. Escribe la idea o pulsa 🎤 para dictarla.';
    const {field, input} = textField('¿Qué quieres recordar de este momento?');
    const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = wasPlaying ? 'Guardar y seguir escuchando' : 'Guardar nota';
    ok.onclick = async () => {
      const note = input.value.trim(); if (!note) return toast('Escribe o dicta la nota primero');
      cur.marks.push({t, chapter, date: Date.now(), note, quick: true});
      cur.marks.sort((a, b) => a.t - b.t); await dbPut('books', cur);
      toast('Nota guardada en ' + fmt(t)); resume();
    };
    body.append(h, field, ok, row('Cancelar', resume));
    setTimeout(() => input.focus(), 250);
  });
};

/* copia de seguridad: progreso, marcadores, apuntes y estadísticas (sin el audio ni la clave) */
async function exportBackup() {
  if (cur) await savePos(true);
  saveStats();
  const bs = await dbAll('books');
  const data = {app: 'audiolibros', version: 1, date: Date.now(), stats, books: bs.map(({cover, ...b}) => b)};
  download(`audiolibros-copia-${dayKey()}.json`, JSON.stringify(data), 'application/json');
  closeSheet(); toast('Copia guardada en Descargas', 3500);
}
const uniqBy = (arr, key) => { const seen = new Set(); return arr.filter(x => { const k = key(x); if (seen.has(k)) return false; seen.add(k); return true; }); };
function mergeBook(lb, sb) {
  if ((sb.lastPlayed || 0) > (lb.lastPlayed || 0)) { lb.pos = sb.pos; lb.lastPlayed = sb.lastPlayed; lb.speed = sb.speed || lb.speed; }
  lb.marks = uniqBy([...(lb.marks || []), ...(sb.marks || [])], m => Math.round(m.t) + '|' + (m.note || '')).sort((a, b) => a.t - b.t);
  lb.notes = uniqBy([...notesOf(lb), ...notesOf({...sb})], n => n.type + '|' + Math.round(n.pos) + '|' + (n.date || 0)).sort((a, b) => a.pos - b.pos);
  if (sb.recap && (!lb.recap || sb.recap.date > lb.recap.date)) lb.recap = sb.recap;
  lb.listened = Math.max(lb.listened || 0, sb.listened || 0);
}
const getPending = () => { try { return JSON.parse(localStorage.getItem('pendingRestore')) || []; } catch { return []; } };
const setPending = p => { try { p.length ? localStorage.setItem('pendingRestore', JSON.stringify(p)) : localStorage.removeItem('pendingRestore'); } catch {} };
function applyPendingRestore(book) {           // libro de la copia cuyo audio se añade después
  const p = getPending(), k = p.findIndex(sb => sb.size === book.size && sb.title === book.title) >= 0
    ? p.findIndex(sb => sb.size === book.size && sb.title === book.title) : p.findIndex(sb => sb.size === book.size);
  if (k < 0) return;
  mergeBook(book, p[k]); p.splice(k, 1); setPending(p);
}
$('#restoreFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'audiolibros' || !Array.isArray(data.books)) throw new Error('formato');
    for (const [k, v] of Object.entries(data.stats?.days || {})) stats.days[k] = Math.max(stats.days[k] || 0, v);
    if (data.stats?.goal && !stats.goal) stats.goal = data.stats.goal;
    saveStats();
    if (cur) await savePos(true);
    const local = await dbAll('books'), pending = getPending();
    let merged = 0;
    for (const sb of data.books) {
      const lb = local.find(b => b.id === sb.id) || local.find(b => b.size === sb.size && b.title === sb.title) || local.find(b => b.size === sb.size);
      if (!lb) { pending.push(sb); continue; }
      mergeBook(lb, sb); await dbPut('books', lb); merged++;
      if (cur && cur.id === lb.id) {
        Object.assign(cur, {marks: lb.marks, notes: lb.notes, recap: lb.recap, listened: lb.listened, speed: lb.speed, lastPlayed: lb.lastPlayed});
        if (audio.paused && Math.abs(cur.pos - lb.pos) > 1) { cur.pos = lb.pos; audio.currentTime = lb.pos; }
      }
    }
    setPending(uniqBy(pending, sb => sb.size + '|' + sb.title));
    closeSheet();
    toast(`Copia recuperada: ${merged} ${merged === 1 ? 'libro' : 'libros'}` + (data.books.length - merged === 1 ? '. El otro se aplicará cuando añadas su audio.' :
      data.books.length - merged ? `. Los otros ${data.books.length - merged} se aplicarán cuando añadas su audio.` : ''), 5000);
    loadLibrary(); if (cur) updateUI();
  } catch (err) { console.error(err); toast('Ese archivo no es una copia de seguridad válida', 4000); }
};
$('#recapBtn').onclick = openRecap;
$('#awayPill').onclick = openRecap;

/* ================= aviso de salida (push) ================= */
// Cada mañana se pregunta a qué hora sales; con la respuesta se programa un aviso unos minutos antes.
// Usa el mismo servidor de avisos (Cloudflare Worker) que la app de dieta.
const PUSH_API = 'https://dieta-avisos.dieta-avisos.workers.dev';
const VAPID_PUBLIC = 'BGfejY7hZbc2tAu5C8TPfhV-hYKLUDG9hb0ke-bQ4Ykn4gmH6ILxwdaCVPGz5txBqcVVS8suqTVFmZ5EJGNYowQ';
const AV_KEY = 'avisos';
// plan: {day: 'AAAA-MM-DD', min: minutos desde las 0:00, o null si hoy no sales}
const AV_DEFAULT = {on: false, endpoint: '', morning: 570, before: 5, plan: null, hash: '', at: 0};
function avGet() { try { return Object.assign({}, AV_DEFAULT, JSON.parse(localStorage.getItem(AV_KEY))); } catch { return {...AV_DEFAULT}; } }
function avSet(v) { try { localStorage.setItem(AV_KEY, JSON.stringify(v)); } catch {} }
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushOnHere = av => av.on && av.endpoint && pushSupported() && Notification.permission === 'granted';
const hhmm = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const todayPlan = av => av.plan && av.plan.day === dayKey() ? av.plan : null;
function b64ToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const raw = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
function strHash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); }
const postJSON = (path, data) => fetch(PUSH_API + path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});

function bookLine() {
  // el libro que está abierto, o el último escuchado
  const b = cur || books[0];
  if (!b) return 'Ponte los cascos y tu audiolibro.';
  const t = cur && cur.id === b.id && audio.readyState > 0 ? audio.currentTime : b.pos || 0;
  let chap = '';
  for (const c of b.chapters || []) if (c.start <= t + 0.25) chap = c.title;
  return `Ponte «${b.title}»${chap ? ' · ' + chap : ''}, donde lo dejaste.`;
}
function buildNotifications(av) {
  const out = [], now = Date.now(), plan = todayPlan(av), base = new Date();
  for (let d = 0; d < 14; d++) {
    const k = dayKey(new Date(base.getFullYear(), base.getMonth(), base.getDate() + d));
    if (d === 0 && plan) continue;              // hoy ya respondiste
    out.push({nid: k + ':pregunta', at: new Date(base.getFullYear(), base.getMonth(), base.getDate() + d, 0, av.morning).getTime(),
      title: '¿A qué hora sales hoy? 🎧', body: 'Elige la hora y te aviso unos minutos antes para que te pongas el audiolibro.', tag: 'salida', url: '#salida'});
  }
  if (plan && plan.min != null && !dayMet(base)) {   // si ya cumpliste el objetivo de hoy, no hace falta
    out.push({nid: `${plan.day}:salida:${plan.min}`, at: new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, plan.min - av.before).getTime(),
      title: `Sales en ${av.before} min 🎧`, body: bookLine(), tag: 'salida', url: ''});
  }
  return out.filter(n => n.at > now);
}
let syncTimer = null;
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncSchedule(false), 2500); }
async function syncSchedule(force, extra = []) {
  const av = avGet(); if (!pushOnHere(av)) return false;
  const items = buildNotifications(av).concat(extra), h = strHash(JSON.stringify(items));
  // el servidor solo guarda 14 días de preguntas: refrescar al menos cada 6 h que se abra la app
  if (!force && h === av.hash && Date.now() - av.at < 6 * 3600e3) return true;
  try {
    let r = await postJSON('/schedule', {endpoint: av.endpoint, items});
    if (r.status === 404) { await postJSON('/subscribe', {endpoint: av.endpoint}); r = await postJSON('/schedule', {endpoint: av.endpoint, items}); }
    if (!r.ok) return false;
    avSet(Object.assign(avGet(), {hash: h, at: Date.now()}));
    return true;
  } catch { return false; }
}
async function pushOn() {
  if (!pushSupported()) throw new Error('navegador sin avisos');
  if (await Notification.requestPermission() !== 'granted') throw new Error('sin permiso');
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC)});
  const r = await postJSON('/subscribe', {endpoint: sub.endpoint});
  if (!r.ok) throw new Error('el servidor respondió ' + r.status);
  avSet(Object.assign(avGet(), {on: true, endpoint: sub.endpoint, hash: '', at: 0}));
  await syncSchedule(true);
}
async function pushOff() {
  const av = avGet();
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); if (av.endpoint) await postJSON('/unsubscribe', {endpoint: av.endpoint}); } catch {}
  avSet(Object.assign(av, {on: false, endpoint: '', hash: '', at: 0}));
}

function chipRow(values, label, isOn, pick) {
  const wrap = document.createElement('div'); wrap.className = 'chips';
  for (const v of values) {
    const c = document.createElement('button'); c.className = 'chip' + (isOn(v) ? ' on' : ''); c.textContent = label(v);
    c.onclick = () => pick(v); wrap.append(c);
  }
  return wrap;
}
const labelEl = txt => { const l = document.createElement('div'); l.className = 'label'; l.textContent = txt; return l; };
const hintEl = txt => { const h = document.createElement('div'); h.className = 'hint'; h.textContent = txt; return h; };

function avisosSheet() {
  const av = avGet();
  sheet('Aviso para escuchar', body => {
    if (!pushSupported()) return body.append(hintEl('Este navegador no admite avisos. Abre la app instalada desde Chrome.'));
    if (!pushOnHere(av)) {
      const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'Activar avisos en este móvil';
      ok.onclick = async () => {
        ok.textContent = 'Activando…';
        try { await pushOn(); toast('Avisos activados'); avisosSheet(); }
        catch (e) { toast('No se pudieron activar: ' + e.message, 5000); ok.textContent = 'Activar avisos en este móvil'; }
      };
      return body.append(hintEl('Cada mañana te pregunto a qué hora sales y te aviso unos minutos antes para que te pongas el audiolibro.'), ok);
    }
    const plan = todayPlan(av);
    body.append(row('Hoy', salidaSheet, '', !plan ? 'sin elegir' : plan.min == null ? 'no sales' : 'sales a las ' + hhmm(plan.min)));
    const save = patch => { avSet(Object.assign(avGet(), patch)); syncSchedule(true); avisosSheet(); };
    body.append(labelEl('Pregunta de la mañana'),
      chipRow([480, 510, 540, 570, 600, 630], hhmm, v => v === av.morning, v => save({morning: v})),
      labelEl('Avisarme antes de salir'),
      chipRow([5, 10, 15], v => v + ' min', v => v === av.before, v => save({before: v})));
    body.append(row('Enviar un aviso de prueba', async () => {
      const ok = await syncSchedule(true, [{nid: 'prueba:' + Date.now(), at: Date.now() + 5000, title: 'Aviso de prueba 🎧', body: bookLine(), tag: 'prueba', url: ''}]);
      toast(ok ? 'Llegará en uno o dos minutos' : 'No se pudo contactar con el servidor', 4000);
    }), row('Quitar avisos de este móvil', async () => { await pushOff(); closeSheet(); toast('Avisos quitados'); }, 'danger'));
  });
}
function salidaSheet() {
  const plan = todayPlan(avGet());
  sheet('¿A qué hora sales hoy?', body => {
    const times = []; for (let m = 600; m <= 840; m += 30) times.push(m);
    body.append(chipRow(times, hhmm, v => plan && plan.min === v, chooseSalida));
    const line = document.createElement('div'); line.className = 'inline';
    const i = document.createElement('input'); i.type = 'time'; i.className = 'text'; i.setAttribute('aria-label', 'Otra hora');
    if (plan && plan.min != null) i.value = String(Math.floor(plan.min / 60)).padStart(2, '0') + ':' + String(plan.min % 60).padStart(2, '0');
    const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'Guardar';
    ok.onclick = () => { if (!i.value) return i.focus(); const [h, m] = i.value.split(':').map(Number); chooseSalida(h * 60 + m); };
    line.append(i, ok);
    body.append(labelEl('Otra hora'), line, row('Hoy no salgo', () => chooseSalida(null), plan && plan.min == null ? 'cur' : ''));
  });
}
async function chooseSalida(min) {
  const av = avGet();
  av.plan = {day: dayKey(), min}; avSet(av); closeSheet();
  if (min == null) toast('Vale, hoy sin aviso');
  else if (!pushOnHere(av)) toast('Guardado. Activa los avisos en ☰ › Aviso para escuchar', 4000);
  else toast(min - av.before > nowMin() ? `Te aviso a las ${hhmm(min - av.before)}` : 'Esa hora ya ha pasado: hoy no habrá aviso', 4000);
  if (pushOnHere(av) && !await syncSchedule(true)) toast('No se pudo contactar con el servidor. Se reintentará al abrir la app', 5000);
}
// al tocar la pregunta de la mañana, la app se abre con #salida
function checkHash() {
  if (location.hash !== '#salida') return;
  history.replaceState(null, '', location.pathname + location.search);
  salidaSheet();
}
window.addEventListener('hashchange', checkHash);

  updatePlayIcons();

  checkHash(); syncSchedule(false);
})();
