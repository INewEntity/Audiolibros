<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiolibros</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<!-- la página solo puede enviar datos a Anthropic (IA) y al servidor de avisos: aunque se colara código, la clave no podría salir a otro sitio -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.anthropic.com https://dieta-avisos.dieta-avisos.workers.dev; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#16130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#16130f; --surface:#211d17; --surface2:#2c2720; --line:#3a342b;
  --text:#f2ebe0; --muted:#a69c8b; --accent:#e0a458; --accent-ink:#1b1408; --danger:#e57373;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f1e8; --surface:#ffffff; --surface2:#ede6d8; --line:#d9cfbc;
    --text:#241e14; --muted:#74695a; --accent:#a8641a; --accent-ink:#fff; --danger:#b3261e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- biblioteca ---------- */
#library{height:100%;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 4px 20px}
header.top h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;letter-spacing:.2px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn-add{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:12px 18px;font-weight:600;font-size:15px}
.list{display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%}
.card:active{background:var(--surface2)}
.cover{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:700;color:#1b1408}
.card .info{flex:1;min-width:0}
.card .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card .m{color:var(--muted);font-size:12px;margin-top:6px}
.more{flex:none;width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:22px;line-height:1}
.more:active{background:var(--surface2)}
.ver{text-align:center;color:var(--muted);font-size:12px;margin:28px 0 0;opacity:.7}
.empty{text-align:center;color:var(--muted);padding:64px 24px;line-height:1.55}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:8px}

/* ---------- mini reproductor ---------- */
#mini{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;gap:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
#mini .cover{width:44px;height:44px;font-size:18px;border-radius:10px}
#mini .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.round svg{width:22px;height:22px;fill:currentColor}

/* ---------- reproductor ---------- */
#player{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));z-index:5;transform:translateY(0);transition:transform .25s ease}
#player.closed{transform:translateY(100%);pointer-events:none;visibility:hidden}
.p-head{display:flex;justify-content:space-between;align-items:center;height:48px}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon:active{background:var(--surface2)}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:22px}
#bigcover{width:min(62vw,280px);aspect-ratio:1;border-radius:28px;margin:0 auto;display:grid;place-items:center;font-family:var(--serif);font-size:min(24vw,110px);font-weight:700;color:#1b1408;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.p-title{text-align:center}
#pChapter{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pBook{color:var(--muted);font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{display:flex;flex-direction:column;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--surface2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-8px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.remain{text-align:center;color:var(--muted);font-size:13px}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.ctrls .skip{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--text)}
.ctrls .skip:active,.ctrls .chap:active{background:var(--surface2)}
.ctrls .skip svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctrls .skip span{position:absolute;font-size:13px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%)}
.ctrls .chap{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.ctrls .chap svg{width:26px;height:26px;fill:currentColor}
.ctrls .play{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ctrls .play svg{width:38px;height:38px;fill:currentColor}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;font-size:11.5px;color:var(--muted);min-width:0}
.tool b{font-size:16px;color:var(--text);font-weight:600;min-height:24px;display:flex;align-items:center}
.tool svg{width:24px;height:24px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:active{background:var(--surface2)}
.tool.on b,.tool.on{color:var(--accent)}

/* ---------- hojas inferiores ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--surface);border-radius:24px 24px 0 0;z-index:11;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{margin:0;padding:20px 22px 10px;font-family:var(--serif);font-size:20px}
#sheetBody{overflow-y:auto;padding:0 12px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-radius:12px;font-size:16px}
.row:active{background:var(--surface2)}
.row small{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.row.cur{color:var(--accent);font-weight:600}
.row.danger{color:var(--danger)}
.row .x{margin-left:auto;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:6px 10px 14px}
.chip{padding:12px 18px;border-radius:999px;background:var(--surface2);font-size:16px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{color:var(--muted);font-size:13px;padding:6px 14px 12px;line-height:1.45}
.label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 14px 2px}
.inline{display:flex;gap:8px;align-items:center;padding:0 10px 10px}
.inline input.text{margin:0;flex:1;width:auto}
.inline .primary{margin:0;width:auto;padding:14px 20px}
.primary{display:block;width:calc(100% - 20px);margin:6px 10px 10px;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
input.text{width:calc(100% - 20px);margin:6px 10px 10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.pill{display:flex;align-items:center;gap:8px;margin:12px auto 0;padding:9px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--accent);font-size:14px;font-weight:600}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recap{margin:4px 10px 12px;padding:16px;border-radius:16px;background:var(--surface2);line-height:1.5;font-size:15.5px}
.recap .lead{font-family:var(--serif);font-size:17px;margin:0 0 10px}
.recap ul{margin:0 0 12px;padding-left:20px}
.recap li{margin:4px 0}
.recap .last{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0}
.recap .last b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.recap .meta{color:var(--muted);font-size:12.5px;margin:12px 0 0}
.hint a{color:var(--accent)}
.listen{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px}
.listen svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
details.why{margin:0 14px 10px;color:var(--muted);font-size:12px}
details.why summary{cursor:pointer;padding:4px 0}
details.why li{margin:4px 0;word-break:break-word}
.busy{display:flex;align-items:center;gap:12px;padding:18px 14px;color:var(--muted)}
.busy i{width:20px;height:20px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cover.img,#bigcover.img{background-size:cover!important;background-position:center!important;color:transparent}
.hdr-actions{display:flex;align-items:center;gap:6px}
.btn-more{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.btn-more:active{background:var(--surface2)}
.btn-more svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .listen{margin-top:0}
.listen.danger{color:var(--danger)}
.recap .q{font-weight:700;margin:0 0 8px}
.recap .a{margin:0;white-space:pre-wrap}
.recap .meta.go{cursor:pointer;color:var(--accent)}
.field{display:flex;gap:8px;align-items:flex-start;margin:6px 10px 10px}
.field textarea{flex:1;min-height:76px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.mic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--text)}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.chaph{font-family:var(--serif);font-size:16px;margin:16px 14px 6px;color:var(--muted)}
.mark{display:flex;align-items:center;gap:4px;border-radius:12px}
.mark .go{flex:1;min-width:0;text-align:left;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:2px}
.mark .go:active{background:var(--surface2)}
.mark .go span{font-size:16px}
.mark .go small{color:var(--muted);font-size:13px}
.mark .x{color:var(--muted);width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 10px 14px}
.stat{background:var(--surface2);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin:4px 14px 6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.week .today{color:var(--text);font-weight:700}
.todaycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 14px}
.todaycard:active{background:var(--surface2)}
.todaycard .ring{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:conic-gradient(var(--accent) var(--p,0%),var(--surface2) 0)}
.todaycard .ring i{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.todaycard.done .ring{background:var(--accent)}
.todaycard .tt{font-weight:600;font-size:15px}
.todaycard .ts{color:var(--muted);font-size:13px;margin-top:2px}
#weekBanner{background:var(--surface2);border:1px solid var(--accent);border-radius:18px;padding:14px 16px;margin:0 0 14px}
#weekBanner b{display:block;font-family:var(--serif);font-size:17px;margin-bottom:4px}
#weekBanner p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.45}
#weekBanner .acts{margin-top:0}
.qnote{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface2);color:var(--accent);font-weight:600;font-size:14px}
.qnote svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qnote:active{opacity:.7}
.seg{display:flex;gap:6px;margin:4px 10px 10px;background:var(--surface2);padding:4px;border-radius:999px}
.seg button{flex:1;padding:9px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600}
.week .met i{background:var(--accent)}
.week i{background:var(--line)}
.week{position:relative}
.week .goal-line{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--muted);opacity:.6;pointer-events:none}
.stats .stat b{font-size:19px;white-space:nowrap}
.delta{font-size:12px;margin-top:2px}
.delta.up{color:#7fb77e}
.delta.down{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>

<main id="library">
  <header class="top">
    <div><h1>Audiolibros</h1><p id="subtitle"></p></div>
    <div class="hdr-actions"><button class="btn-more" id="moreBtn" aria-label="Más opciones"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    <button class="btn-add" id="addBtn">+ Añadir</button></div>
  </header>
  <div id="weekBanner" class="hidden"></div>
  <button class="todaycard hidden" id="today"></button>
  <div class="list" id="list"></div>
  <p class="ver" id="ver"></p>
  <div class="empty hidden" id="empty">
    <b>Tu biblioteca está vacía</b>
    Pulsa «Añadir» y elige un archivo .m4b o .mp3 de tu móvil.<br>Se guarda dentro de la app y funciona sin conexión.
  </div>
</main>

<div id="mini" class="hidden">
  <button class="open" id="miniOpen">
    <div class="cover" id="miniCover"></div>
    <div style="min-width:0"><div class="t" id="miniTitle"></div><div class="c" id="miniChap"></div></div>
  </button>
  <button class="round" id="miniPlay" aria-label="Reproducir o pausar"></button>
</div>

<section id="player" class="closed" aria-label="Reproductor">
  <div class="p-head">
    <button class="icon" id="closeP" aria-label="Cerrar reproductor"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="qnote" id="quickNote" aria-label="Nota rápida en este minuto"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Nota</span></button>
    <button class="icon" id="bookMenu" aria-label="Más opciones"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
  </div>
  <div class="p-body">
    <div id="bigcover"></div>
    <div class="p-title"><div id="pChapter"></div><div id="pBook"></div>
      <button class="pill hidden" id="awayPill"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span id="awayTxt"></span></button></div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición en el capítulo">
      <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
      <div class="remain" id="remain"></div>
    </div>
    <div class="ctrls">
      <button class="chap" id="prevCh" aria-label="Capítulo anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
      <button class="skip" id="back" aria-label="Retroceder 15 segundos"><svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 1-14.4 9"/><path d="M24 2l-6 6 6 6"/></svg><span>15</span></button>
      <button class="play" id="play" aria-label="Reproducir o pausar"></button>
      <button class="skip" id="fwd" aria-label="Adelantar 30 segundos"><svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 0 14.4 9"/><path d="M24 2l6 6-6 6"/></svg><span>30</span></button>
      <button class="chap" id="nextCh" aria-label="Capítulo siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
    </div>
    <div class="tools">
      <button class="tool" id="speedBtn"><b id="speedLbl">1×</b>Velocidad</button>
      <button class="tool" id="sleepBtn"><b id="sleepLbl"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></b>Dormir</button>
      <button class="tool" id="chapBtn"><b><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></b>Capítulos</button>
      <button class="tool" id="markBtn"><b><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></b>Marcadores</button>

<script>
'use strict';
const $ = s => document.querySelector(s);
const audio = $('#audio');
const APP_VERSION = 13;                        // súbelo junto con CACHE en sw.js

/* ================= almacenamiento (IndexedDB) ================= */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('audiolibros', 2);
  r.onupgradeneeded = () => {
    for (const name of ['books', 'blobs', 'texts'])          // texts: texto de cada libro (EPUB)
      if (!r.result.objectStoreNames.contains(name)) r.result.createObjectStore(name, {keyPath: 'id'});
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idb(store, mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const dbAll   = s => idb(s, 'readonly',  o => o.getAll());
const dbGet   = (s, k) => idb(s, 'readonly', o => o.get(k));
const dbPut   = (s, v) => idb(s, 'readwrite', o => o.put(v));
const dbDel   = (s, k) => idb(s, 'readwrite', o => o.delete(k));

/* ================= utilidades ================= */
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
};
const human = s => {
  s = Math.max(0, Math.round(s / 60));
  const h = Math.floor(s / 60), m = s % 60;
  return h ? `${h} h ${m} min` : `${m} min`;
};
const PALETTE = ['#e0a458', '#d98c7a', '#9bbf8f', '#8fb4d0', '#c4a2d6', '#d8c36a'];
const colorOf = id => PALETTE[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const initial = t => (t.match(/\p{L}/u) || ['♪'])[0].toUpperCase();
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms);
}
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

/* ================= lectura de metadatos MP4/M4B ================= */
function walk(dv, start, end, cb) {
  let o = start;
  while (o + 8 <= end) {
    let size = dv.getUint32(o), hdr = 8;
    const type = String.fromCharCode(dv.getUint8(o+4), dv.getUint8(o+5), dv.getUint8(o+6), dv.getUint8(o+7));
    if (size === 1) { size = Number(dv.getBigUint64(o + 8)); hdr = 16; }
    else if (size === 0) size = end - o;
    if (size < hdr || o + size > end) break;
    cb(type, o + hdr, o + size);
    o += size;
  }
}
const utf8 = new TextDecoder('utf-8');
const str4 = (dv, o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o+1), dv.getUint8(o+2), dv.getUint8(o+3));
async function readMoov(file) {
  let off = 0;
  while (off + 8 <= file.size) {
    const dv = new DataView(await file.slice(off, off + 16).arrayBuffer());
    let size = dv.getUint32(0), hdr = 8;
    const type = str4(dv, 4);
    if (size === 1) { size = Number(dv.getBigUint64(8)); hdr = 16; }
    else if (size === 0) size = file.size - off;
    if (size < hdr) break;
    if (type === 'moov') return file.slice(off + hdr, off + size).arrayBuffer();
    off += size;
  }
  return null;
}
async function readMeta(file) {
  const out = {title: '', artist: '', chapters: [], cover: null};
  try {
    const buf = await readMoov(file);
    if (!buf) return out;
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    walk(dv, 0, buf.byteLength, (t, s, e) => {
      if (t !== 'udta') return;
      walk(dv, s, e, (t2, s2, e2) => {
        if (t2 === 'chpl') {
          let p = s2 + 8;                       // versión+flags, reservado
          const n = dv.getUint8(p++);
          for (let i = 0; i < n && p + 9 <= e2; i++) {
            const start = Number(dv.getBigUint64(p)) / 1e7; p += 8;
            const len = dv.getUint8(p++);
            out.chapters.push({start, title: utf8.decode(u8.subarray(p, p + len))}); p += len;
          }
        } else if (t2 === 'meta') {
          walk(dv, s2 + 4, e2, (t3, s3, e3) => {
            if (t3 !== 'ilst') return;
            walk(dv, s3, e3, (t4, s4, e4) => {
              walk(dv, s4, e4, (t5, s5, e5) => {
                if (t5 !== 'data') return;
                if (t4 === 'covr') {                    // portada: tipo 13 = JPEG, 14 = PNG
                  if (!out.cover) out.cover = new Blob([u8.slice(s5 + 8, e5)], {type: (dv.getUint32(s5) & 0xffffff) === 14 ? 'image/png' : 'image/jpeg'});
                  return;
                }
                const txt = utf8.decode(u8.subarray(s5 + 8, e5));
                if (t4 === '\xa9nam') out.title = txt;
                else if (t4 === '\xa9ART' || t4 === 'aART') out.artist = out.artist || txt;
              });
            });
          });
        }
      });
    });
  } catch (e) { console.warn('metadatos', e); }
  return out;
}
function getDuration(file) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(file);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { const d = a.duration; URL.revokeObjectURL(u); res(isFinite(d) ? d : 0); };
    a.onerror = () => { URL.revokeObjectURL(u); res(0); };
    a.src = u;
  });
}

/* ================= biblioteca ================= */
let books = [];
async function loadLibrary() {
  books = (await dbAll('books')).sort((a, b) => (b.lastPlayed || b.added) - (a.lastPlayed || a.added));
  renderLibrary();
  ensureCovers();
}
/* portadas: las de libros añadidos antes de esta versión se sacan del archivo una sola vez */
const coverUrls = new Map();
function paintCover(el, b) {
  el.style.background = colorOf(b.id);
  if (b.cover) {
    let u = coverUrls.get(b.id);
    if (!u) coverUrls.set(b.id, u = URL.createObjectURL(b.cover));
    el.style.backgroundImage = `url("${u}")`; el.classList.add('img'); el.textContent = '';
  } else { el.classList.remove('img'); el.textContent = initial(b.title); }
}
let coversRunning = false;
async function ensureCovers() {
  if (coversRunning) return; coversRunning = true;
  try {
    for (const b of books.filter(x => x.cover === undefined)) {
      const rec = await dbGet('blobs', b.id);
      b.cover = rec ? (await readMeta(rec.blob)).cover : null;
      if (cur && cur.id === b.id) { cur.cover = b.cover; updateUI(); }
      await dbPut('books', b);
      renderLibrary();
    }
  } catch (e) { console.warn('portadas', e); } finally { coversRunning = false; }
}
function renderLibrary() {
  const list = $('#list');
  list.innerHTML = '';
  $('#empty').classList.toggle('hidden', books.length > 0);
  $('#subtitle').textContent = books.length ? `${books.length} ${books.length === 1 ? 'libro' : 'libros'}` : '';
  renderToday();
  for (const b of books) {
    const pct = b.duration ? Math.min(100, b.pos / b.duration * 100) : 0;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="cover"></div>
      <div class="info"><div class="t"></div><div class="a"></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="m"></div></div>
      <button class="more" aria-label="Opciones del libro">⋮</button>`;
    paintCover(el.querySelector('.cover'), b);
    el.querySelector('.t').textContent = b.title;
    el.querySelector('.a').textContent = b.artist || '';
    el.querySelector('.m').textContent = pct >= 99 ? 'Terminado' :
      b.pos > 5 ? `${Math.round(pct)} % · quedan ${human(b.duration - b.pos)}` : human(b.duration);
    el.addEventListener('click', e => {
      if (e.target.closest('.more')) return libraryMenu(b);
      openBook(b.id, true);
    });
    list.appendChild(el);
  }
}
function libraryMenu(b) {
  sheet(b.title.length > 40 ? b.title.slice(0, 40) + '…' : b.title, body => {
    body.append(
      row(`Apuntes (${notesOf(b).length})`, () => openNotes(b)),
      row(b.hasText ? 'Texto del libro (EPUB) ✓' : 'Añadir texto del libro (EPUB)', () => textMenu(b)),
      row('Renombrar', () => { closeSheet(); renameBook(b); }),
      row('Marcar como no escuchado', async () => { b.pos = 0; await dbPut('books', b); if (cur && cur.id === b.id) audio.currentTime = 0; closeSheet(); renderLibrary(); }),
      row('Eliminar de la app', () => { closeSheet(); deleteBook(b); }, 'danger'));
  });
}
function renameBook(b) {
  sheet('Renombrar', body => {
    const i = document.createElement('input'); i.className = 'text'; i.value = b.title;
    const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'Guardar';
    ok.onclick = async () => { b.title = i.value.trim() || b.title; await dbPut('books', b); closeSheet(); renderLibrary(); if (cur && cur.id === b.id) updateUI(); };
    body.append(i, ok); setTimeout(() => i.select(), 50);
  });
}
async function deleteBook(b) {
  sheet('¿Eliminar este libro?', body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = 'Se borra el audio de la app (no el archivo original de tu móvil), junto con el progreso y los marcadores.';
    const ok = document.createElement('button'); ok.className = 'primary'; ok.style.background = 'var(--danger)'; ok.style.color = '#fff'; ok.textContent = 'Eliminar';
    ok.onclick = async () => {
      if (cur && cur.id === b.id) unloadBook();
      if (coverUrls.has(b.id)) { URL.revokeObjectURL(coverUrls.get(b.id)); coverUrls.delete(b.id); }
      await dbDel('books', b.id); await dbDel('blobs', b.id); await dbDel('texts', b.id);
      closeSheet(); loadLibrary();
    };
    body.append(h, ok);
  });
}

/* ================= importar ================= */
$('#addBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const [i, f] of files.entries()) {
    toast(`Importando ${i + 1}/${files.length}: ${f.name}…`, 600000);
    try {
      const meta = await readMeta(f);
      const duration = await getDuration(f);
      const id = crypto.randomUUID();
      const title = meta.title || f.name.replace(/\.[^.]+$/, '');
      await dbPut('blobs', {id, blob: f});
      const book = {id, title, artist: meta.artist, duration, chapters: meta.chapters, cover: meta.cover,
        pos: 0, speed: 1, marks: [], notes: [], added: Date.now(), lastPlayed: 0, size: f.size};
      applyPendingRestore(book);
      await dbPut('books', book);
    } catch (err) {
      console.error(err); toast('No se pudo importar ' + f.name + '. ¿Poco espacio libre?', 5000); continue;
    }
  }
  if (files.length) toast('Listo');
  loadLibrary();
};

/* ================= reproductor ================= */
let cur = null, curUrl = null, lastSave = 0, startChapter = -1, seeking = false;
const chapters = () => (cur && cur.chapters.length) ? cur.chapters : null;
function chapterIndex(t) {
  const c = chapters(); if (!c) return -1;
  let lo = 0, hi = c.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (c[mid].start <= t + 0.25) lo = mid; else hi = mid - 1; }
  return lo;
}
const chapterRange = i => {
  const c = chapters(), d = audio.duration || cur.duration;
  return c ? [c[i].start, i + 1 < c.length ? c[i + 1].start : d] : [0, d];
};

async function openBook(id, show) {
  if (cur && cur.id === id) { if (show) showPlayer(); return; }
  const book = books.find(b => b.id === id) || await dbGet('books', id);
  const rec = await dbGet('blobs', id);
  if (!book || !rec) return toast('No se encontró el archivo de audio');
  await savePos(true);
  unloadBook();
  showAwayPill(book);
  const resumeFrom = book.lastPlayed;
  cur = book; cur.marks = cur.marks || [];
  curUrl = URL.createObjectURL(rec.blob);
  audio.src = curUrl;
  audio.playbackRate = cur.speed || 1;
  audio.addEventListener('loadedmetadata', function f() {
    audio.removeEventListener('loadedmetadata', f);
    audio.currentTime = Math.min(cur.pos || 0, (audio.duration || 1e9) - 1);
    pausedAt = resumeFrom || 0; pausedPos = audio.currentTime;
    if (!cur.duration && isFinite(audio.duration)) cur.duration = audio.duration;
    audio.playbackRate = cur.speed || 1;
    updateUI();
  });
  cur.lastPlayed = Date.now();
  $('#mini').classList.remove('hidden');
  updateMediaSession(); updateUI();
  if (show) showPlayer();
  try { localStorage.setItem('last', id); } catch {}
}
function unloadBook() {
  audio.pause(); audio.removeAttribute('src'); audio.load();
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = null; cur = null; clearSleep(); $('#awayPill').classList.add('hidden');
  $('#mini').classList.add('hidden'); hidePlayer();
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
}
const showPlayer = () => $('#player').classList.remove('closed');
const hidePlayer = () => $('#player').classList.add('closed');
$('#miniOpen').onclick = showPlayer;
$('#closeP').onclick = () => { hidePlayer(); loadLibrary(); };
$('#bookMenu').onclick = () => cur && libraryMenu(cur);

async function savePos(force) {
  if (!cur) return;
  const now = Date.now();
  if (!force && now - lastSave < 4000) return;
  lastSave = now;
  if (isFinite(audio.currentTime) && audio.readyState > 0) cur.pos = audio.currentTime;
  cur.lastPlayed = now;
  try { await dbPut('books', cur); } catch {}
}
function toggle() { audio.paused ? audio.play().catch(() => {}) : audio.pause(); }
function skip(d) { if (!cur) return; audio.currentTime = Math.max(0, Math.min((audio.duration || 1e9) - 0.5, audio.currentTime + d)); }
function gotoChapter(delta) {
  const c = chapters(); if (!c) return skip(delta > 0 ? 300 : -300);
  let i = chapterIndex(audio.currentTime);
  if (delta < 0 && audio.currentTime - c[i].start > 4) { audio.currentTime = c[i].start; return; }
  i = Math.max(0, Math.min(c.length - 1, i + delta));
  audio.currentTime = c[i].start;
}
$('#play').onclick = $('#miniPlay').onclick = toggle;
$('#back').onclick = () => skip(-15);
$('#fwd').onclick = () => skip(30);
$('#prevCh').onclick = () => gotoChapter(-1);
$('#nextCh').onclick = () => gotoChapter(1);

audio.addEventListener('play', () => { autoRewind(); statTick = 0; updatePlayIcons(); if (window.speechSynthesis && speaking) stopSpeaking(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audio.addEventListener('pause', () => { pausedAt = Date.now(); pausedPos = audio.currentTime; trackListening(); saveStats(); updatePlayIcons(); savePos(true); queueSync(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
audio.addEventListener('ended', async () => { if (cur) { cur.pos = audio.duration; await savePos(true); } updatePlayIcons(); });
audio.addEventListener('timeupdate', () => { updateProgress(); trackListening(); savePos(false); checkSleepChapter(); });

/* retroceso automático: al reanudar tras una pausa vuelve unos segundos para retomar el hilo */
let pausedAt = 0, pausedPos = -1;
function autoRewind() {
  const gap = (Date.now() - pausedAt) / 1000, moved = Math.abs(audio.currentTime - pausedPos) > 1;
  const was = pausedAt; pausedAt = 0;
  if (!cur || !was || moved) return;                  // si has movido la posición, se respeta
  const back = gap < 15 ? 0 : gap < 300 ? 5 : gap < 3600 ? 10 : gap < 86400 ? 20 : 30;
  if (!back) return;
  const i = chapterIndex(audio.currentTime), start = i >= 0 ? chapters()[i].start : 0;
  const t = Math.max(start, audio.currentTime - back), d = Math.round(audio.currentTime - t);
  if (d < 1) return;
  audio.currentTime = t; pausedPos = t;
  toast(`↺ ${d} s atrás para retomar el hilo`, 1800);
}

/* estadísticas de escucha: segundos reales escuchados por día (no posición) */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let stats = (() => { try { return JSON.parse(localStorage.getItem('stats')) || {days: {}}; } catch { return {days: {}}; } })();
let statTick = 0, statDirty = 0;
function trackListening() {
  const now = Date.now();
  if (cur && statTick && now - statTick < 5000) {
    const dt = (now - statTick) / 1000, k = dayKey();
    const before = stats.days[k] || 0;
    stats.days[k] = before + dt;
    cur.listened = (cur.listened || 0) + dt;
    if ((statDirty += dt) > 15) saveStats();
    if (before < goalSec() && stats.days[k] >= goalSec()) {        // se acaba de cumplir el objetivo de hoy
      saveStats(); renderToday();
      toast(`🎯 Objetivo de hoy cumplido · racha de ${streak()} ${streak() === 1 ? 'día' : 'días'}`, 3500);
    }
  }
  statTick = audio.paused ? 0 : now;
}
function saveStats() { statDirty = 0; try { localStorage.setItem('stats', JSON.stringify(stats)); } catch {} }
/* objetivo diario: minutos para dar el día por cumplido (configurable, 10 por defecto) */
const GOAL_OPTIONS = [5, 10, 15, 20, 30, 45, 60];
const goalMin = () => stats.goal || 10;
const goalSec = () => goalMin() * 60;
const dayMet = d => (stats.days[dayKey(d)] || 0) >= goalSec();
function streak() {
  const d = new Date(); let n = 0;
  if (!dayMet(d)) d.setDate(d.getDate() - 1);   // hoy aún no está cumplido: la racha sigue viva hasta medianoche
  while (dayMet(d)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bestStreak() {
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(stats.days).sort()) {
    if (stats.days[k] < goalSec()) { run = 0; prev = null; continue; }
    const d = new Date(k + 'T12:00');
    run = prev && Math.round((d - prev) / 86400000) === 1 ? run + 1 : 1;
    prev = d; best = Math.max(best, run);
  }
  return best;
}
audio.addEventListener('error', () => toast('Error al reproducir el audio'));
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(true); });
window.addEventListener('pagehide', () => savePos(true));

function updatePlayIcons() {
  const html = audio.paused ? ICON_PLAY : ICON_PAUSE;
  $('#play').innerHTML = html; $('#miniPlay').innerHTML = html;
}
let lastChapterShown = -2;
function updateProgress() {
  if (!cur || seeking) return;
  const t = audio.currentTime, dur = audio.duration || cur.duration || 0;
  const i = chapterIndex(t), [s, e] = chapterRange(Math.max(0, i));
  const p = e > s ? (t - s) / (e - s) : 0;
  const seek = $('#seek');
  seek.value = Math.round(p * 1000); seek.style.setProperty('--p', (p * 100) + '%');
  const rate = audio.playbackRate || 1;
  $('#tCur').textContent = fmt(t - s);
  $('#tLeft').textContent = '-' + fmt((e - t) / rate);
  $('#remain').textContent = `Quedan ${human((dur - t) / rate)} de libro`;
  if (i !== lastChapterShown) { lastChapterShown = i; updateUI(); }
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && dur) {
    try { navigator.mediaSession.setPositionState({duration: dur, playbackRate: rate, position: Math.min(t, dur)}); } catch {}
  }
}
function updateUI() {
  if (!cur) return;
  const i = chapterIndex(audio.currentTime);
  const chap = i >= 0 ? chapters()[i].title : '';
  $('#pChapter').textContent = chap || cur.title;
  $('#pBook').textContent = chap ? cur.title : (cur.artist || '');
  $('#miniTitle').textContent = cur.title;
  $('#miniChap').textContent = chap || cur.artist || '';
  for (const id of ['#bigcover', '#miniCover']) paintCover($(id), cur);
  $('#speedLbl').textContent = (cur.speed || 1) + '×';
  $('#chapBtn').style.display = chapters() ? '' : 'none';
  $('#prevCh').style.visibility = $('#nextCh').style.visibility = 'visible';
  updatePlayIcons();
  document.title = cur.title;
  updateMediaSession();
}
const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  seeking = true;
  const [s, e] = chapterRange(Math.max(0, chapterIndex(audio.currentTime)));
  const p = seekEl.value / 1000;
  seekEl.style.setProperty('--p', (p * 100) + '%');
  $('#tCur').textContent = fmt(p * (e - s));
  $('#tLeft').textContent = '-' + fmt((1 - p) * (e - s) / (audio.playbackRate || 1));
});
seekEl.addEventListener('change', () => {
  const [s, e] = chapterRange(Math.max(0, chapterIndex(audio.currentTime)));
  audio.currentTime = s + (seekEl.value / 1000) * (e - s);
  seeking = false;
});

/* ================= pantalla de bloqueo / notificación ================= */
function updateMediaSession() {
  if (!('mediaSession' in navigator) || !cur) return;
  const i = chapterIndex(audio.currentTime);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: i >= 0 ? chapters()[i].title : cur.title,
    artist: cur.artist || 'Audiolibro',
    album: cur.title,
    artwork: cur.cover && coverUrls.get(cur.id) ? [{src: coverUrls.get(cur.id), type: cur.cover.type}]
      : [{src: 'icon-512.png', sizes: '512x512', type: 'image/png'}]
  });
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };

/* ---------- EPUB: texto y capítulos ---------- */
async function unzip(file) {                    // lector ZIP mínimo (un EPUB es un ZIP)
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('El archivo no es un EPUB válido');
  const files = new Map(), n = dv.getUint16(e + 10, true);
  for (let i = 0, p = dv.getUint32(e + 16, true); i < n; i++) {
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    files.set(utf8.decode(buf.subarray(p + 46, p + 46 + nlen)),
      {method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), at: dv.getUint32(p + 42, true)});
    p += 46 + nlen + xlen + clen;
  }
  return async name => {
    const f = files.get(name); if (!f) return null;
    const start = f.at + 30 + dv.getUint16(f.at + 26, true) + dv.getUint16(f.at + 28, true);
    const data = buf.subarray(start, start + f.size);
    if (f.method === 0) return utf8.decode(data);
    if (f.method === 8) return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    throw new Error('Compresión del EPUB no soportada');
  };
}
const resolvePath = (base, rel) => decodeURIComponent(new URL(rel, 'http://x/' + base).pathname.slice(1));
function parseXml(src, type = 'application/xhtml+xml') {
  let d = new DOMParser().parseFromString(src, type);
  if (d.querySelector('parsererror')) d = new DOMParser().parseFromString(src, 'text/html');
  return d;
}
const BLOCK = /^(p|div|h[1-6]|li|blockquote|section|article|header|footer|tr|br|hr|dd|dt|pre|figcaption|aside)$/i;
function docText(doc, startOffset, ids) {      // texto plano con saltos de párrafo; anota dónde empieza cada id
  let out = '';
  const walk = node => {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) { out += c.data.replace(/\s+/g, ' '); continue; }
      if (c.nodeType !== 1 || /^(script|style|head)$/i.test(c.localName)) continue;
      if (c.id) ids.set(c.id, startOffset + out.length);
      const block = BLOCK.test(c.localName);
      if (block && !out.endsWith('\n')) out += '\n';
      walk(c);
      if (block && !out.endsWith('\n')) out += '\n';
    }
  };
  walk(doc.body || doc.documentElement);
  return out.replace(/ *\n */g, '\n').replace(/\n{2,}/g, '\n');
}
async function parseEpub(file) {
  const read = await unzip(file);
  const container = await read('META-INF/container.xml');
  if (!container) throw new Error('El archivo no es un EPUB válido');
  const opfPath = parseXml(container, 'application/xml').querySelector('rootfile').getAttribute('full-path');
  const opf = parseXml(await read(opfPath), 'application/xml');
  const items = new Map([...opf.querySelectorAll('manifest > item')].map(it =>
    [it.getAttribute('id'), {href: resolvePath(opfPath, it.getAttribute('href')), props: it.getAttribute('properties') || '', type: it.getAttribute('media-type')}]));
  const spine = [...opf.querySelectorAll('spine > itemref')].map(r => items.get(r.getAttribute('idref'))).filter(Boolean);
  let text = '';
  const fileStart = new Map(), ids = new Map();
  for (const it of spine) {
    const src = await read(it.href); if (src == null) continue;
    const idMap = new Map();
    fileStart.set(it.href, text.length);
    text += docText(parseXml(src), text.length, idMap) + '\n';
    for (const [k, v] of idMap) ids.set(it.href + '#' + k, v);
  }
  // índice: nav de EPUB 3 o toc.ncx de EPUB 2
  const toc = [];
  const nav = [...items.values()].find(x => /\bnav\b/.test(x.props));
  if (nav) {
    const d = parseXml(await read(nav.href));
    const navEl = [...d.querySelectorAll('nav')].find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || d.querySelector('nav');
    for (const a of navEl ? navEl.querySelectorAll('a[href]') : []) toc.push({title: a.textContent.replace(/\s+/g, ' ').trim(), href: resolvePath(nav.href, a.getAttribute('href'))});
  } else {
    const ncxId = opf.querySelector('spine')?.getAttribute('toc'), ncx = items.get(ncxId) || [...items.values()].find(x => /ncx/.test(x.type));
    if (ncx) {
      const d = parseXml(await read(ncx.href), 'application/xml');
      for (const np of d.querySelectorAll('navPoint')) {
        const src = np.querySelector('content')?.getAttribute('src'); if (!src) continue;
        toc.push({title: (np.querySelector('navLabel text')?.textContent || '').trim(), href: resolvePath(ncx.href, src)});
      }
    }
  }
  const chapters = uniqBy(toc.map(t => {
    const [f, frag] = t.href.split('#');
    const off = frag && ids.has(f + '#' + frag) ? ids.get(f + '#' + frag) : fileStart.get(f);
    return off == null ? null : {title: t.title, off};
  }).filter(Boolean), c => c.off).sort((a, b) => a.off - b.off);
  if (text.trim().length < 1000) throw new Error('No se encontró texto en el EPUB');
  return {text, chapters, name: file.name};
}

/* ---------- del minuto del audio a la posición en el texto ---------- */
const normTitle = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\b(capitulo|cap|chapter|parte|part|seccion)\b/g, ' ').replace(/\s+/g, ' ').trim();
function titleScore(a, b) {
  const A = normTitle(a).split(' ').filter(Boolean), B = new Set(normTitle(b).split(' ').filter(Boolean));
  if (!A.length || !B.size) return 0;
  const words = A.filter(w => !/^\d+$/.test(w)), common = words.filter(w => B.has(w)).length;
  const nA = A.find(w => /^\d+$/.test(w)), nB = [...B].find(w => /^\d+$/.test(w));
  const wordScore = words.length ? common / Math.max(words.length, [...B].filter(w => !/^\d+$/.test(w)).length || 1) : 0;
  return (nA && nA === nB ? 0.6 : 0) + wordScore;
}
// puntos de referencia (segundo del audio ↔ carácter del texto): capítulos con título parecido y los ajustes manuales
function textAnchors(book, tx) {
  const dur = book.duration || audio.duration || 1, pts = [];
  let j0 = 0;
  for (const ch of book.chapters || []) {
    let best = -1, bestScore = 0.55;
    for (let j = j0; j < tx.chapters.length; j++) { const s = titleScore(ch.title, tx.chapters[j].title); if (s > bestScore) { bestScore = s; best = j; } }
    if (best >= 0) { pts.push({t: ch.start, off: tx.chapters[best].off}); j0 = best + 1; }
  }
  for (const a of book.textAnchors || []) pts.push({t: a.t, off: a.off, manual: true});
  if (!pts.some(p => p.t < 30)) pts.push({t: 0, off: tx.chapters[0]?.off || 0});
  pts.push({t: dur, off: tx.text.length});
  pts.sort((a, b) => a.t - b.t || (b.manual ? 1 : 0) - (a.manual ? 1 : 0));
  const out = [];                                  // solo puntos que avanzan a la vez en tiempo y en texto
  for (const p of pts) {                           // un ajuste manual manda sobre los automáticos que lo contradicen
    if (p.manual) while (out.length && !out.at(-1).manual && (out.at(-1).off >= p.off || out.at(-1).t >= p.t)) out.pop();
    const last = out.at(-1);
    if (!last || (p.t > last.t && p.off > last.off)) out.push(p);
  }
  return out;
}
function textOffsetAt(book, tx, t) {
  const pts = textAnchors(book, tx);
  for (let k = 1; k < pts.length; k++) if (t <= pts[k].t) {
    const a = pts[k - 1], b = pts[k];
    return Math.round(a.off + (b.off - a.off) * (t - a.t) / (b.t - a.t));
  }
  return tx.text.length;
}
const bookText = id => dbGet('texts', id);
const MAX_TEXT_CHARS = 300000;                   // ~75.000 tokens como mucho por petición
const CHARS_PER_MIN = 3000;                      // se narran ~1.000 caracteres por minuto; el triple da margen sin disparar el coste
function excerpt(tx, from, to, margin = 800, mins = 0) {   // texto escuchado + un margen marcado tras la posición estimada
  const cap = Math.min(MAX_TEXT_CHARS, mins ? mins * CHARS_PER_MIN : MAX_TEXT_CHARS);
  from = Math.max(0, Math.min(from, to - 1500)); from = Math.max(from, to - cap);
  const cut = s => s.replace(/^\S*\s/, '');      // sin palabras cortadas al principio
  return cut(tx.text.slice(from, to)) + '\n\n[POSICIÓN ESTIMADA DEL OYENTE]\n\n' + tx.text.slice(to, to + margin);
}

/* ---------- llamada a Claude ---------- */
let sdkPromise = null;
const loadSdk = () => sdkPromise || (sdkPromise = import('./vendor/anthropic-sdk.mjs').then(m => m.default));
const RECAP_SCHEMA = {type: 'object', additionalProperties: false, required: ['donde', 'temas', 'ultima'],
  properties: {donde: {type: 'string'}, temas: {type: 'array', items: {type: 'string'}}, ultima: {type: 'string'}}};
const ANSWER_SCHEMA = {type: 'object', additionalProperties: false, required: ['respuesta'], properties: {respuesta: {type: 'string'}}};
async function askClaude(system, content, schema) {
  const Anthropic = await loadSdk();
  const client = new Anthropic({apiKey: getKey(), dangerouslyAllowBrowser: true, timeout: 180000, maxRetries: 2});
  let res;
  try {
    res = await client.beta.messages.create({
      model: CLAUDE_MODEL, max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',   // si un filtro de seguridad rechaza, otro modelo lo reintenta
      output_config: {effort: 'medium', format: {type: 'json_schema', schema}},
      system, messages: [{role: 'user', content}],
    });
  } catch (e) {
    if (e instanceof Anthropic.AuthenticationError) throw Object.assign(new Error('La clave de Anthropic no es válida'), {badKey: true});
    if (e instanceof Anthropic.PermissionDeniedError) throw new Error('Esta clave no tiene permiso para usar Claude.');
    if (e instanceof Anthropic.RateLimitError) throw new Error('Has hecho demasiadas peticiones seguidas. Espera un minuto y vuelve a intentarlo.');
    if (e instanceof Anthropic.APIConnectionError) throw new Error('No hay conexión a internet (o Anthropic no responde). Esta función necesita conexión.');
    if (e instanceof Anthropic.BadRequestError && /credit balance/i.test(e.message)) throw new Error('Tu cuenta de Anthropic no tiene saldo. Añade crédito en console.anthropic.com → Billing.');
    if (e instanceof Anthropic.InternalServerError || e?.status === 529) throw new Error('Claude está saturado ahora mismo. Prueba de nuevo en unos minutos.');
    if (e instanceof Anthropic.APIError) throw new Error(`Error de Anthropic (${e.status ?? 'sin código'}): ${e.error?.error?.message || e.message}`);
    throw e;
  }
  if (res.stop_reason === 'refusal') throw new Error('Claude no ha querido responder a esta petición.');
  if (res.stop_reason === 'max_tokens') throw new Error('La respuesta de Claude salió cortada. Prueba con un tramo más corto.');
  const txt = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
  try { return JSON.parse(txt); } catch { throw new Error('Claude devolvió una respuesta que no se pudo leer.'); }
}

const RECAP_SYSTEM = 'Ayudas a alguien a retomar un audiolibro que estaba escuchando. Recibes el texto del libro correspondiente a lo último que ha escuchado. ' +
  'La marca [POSICIÓN ESTIMADA DEL OYENTE] señala aproximadamente dónde lo dejó: el texto posterior es solo un margen por si la estimación se quedó corta, no lo resumas como si ya lo hubiera oído. ' +
  'Responde en español, claro y breve. Cíñete al texto; no inventes.';
async function makeRecap(min, onStatus) {
  onStatus('Buscando en el libro lo que escuchaste…');
  const tx = await bookText(cur.id);
  if (!tx) throw Object.assign(new Error('Este libro aún no tiene su EPUB.'), {needText: true});
  const t1 = audio.currentTime, t0 = Math.max(0, t1 - min * 60);
  const i = chapterIndex(t1), chap = i >= 0 ? chapters()[i].title : '';
  const dur = audio.duration || cur.duration, pct = dur ? Math.round(t1 / dur * 100) : 0;
  const prev = cur.recap && cur.recap.pos < t0 ? cur.recap.data : null;
  const content = [
    {type: 'text', text: `<fragmento>\n${excerpt(tx, textOffsetAt(cur, tx, t0), textOffsetAt(cur, tx, t1), 800, min)}\n</fragmento>`},
    {type: 'text', text: `Libro: «${cur.title}»${cur.artist ? ` (${cur.artist})` : ''}${chap ? `. Capítulo del audio: «${chap}»` : ''}. Va por el ${pct} % del libro; el fragmento son unos ${min} minutos de escucha.\n` +
      (prev ? `Resumen anterior, de más atrás en el libro: ${prev.donde}\n` : '') +
      'Devuelve:\n- donde: una o dos frases sobre en qué parte del libro está y de qué trata este tramo.\n' +
      '- temas: entre 3 y 6 puntos, en orden, con las ideas, argumentos, ejemplos, casos o personas que aparecen.\n' +
      '- ultima: la idea concreta que se estaba explicando justo antes de la marca, donde lo dejó.'}];
  onStatus('Claude está leyendo el tramo y resumiendo…');
  const data = await askClaude(RECAP_SYSTEM, content, RECAP_SCHEMA);
  cur.recap = {pos: t1, min, chapter: chap, date: Date.now(), data};
  await addNote({type: 'recap', ...cur.recap});
  return cur.recap;
}

/* ---------- apuntes: cada resumen y cada pregunta se guardan por libro ---------- */
function notesOf(b) {
  if (!b.notes) b.notes = b.recap ? [{type: 'recap', ...b.recap}] : [];
  return b.notes;
}
async function addNote(n) {
  const ns = notesOf(cur);
  if (n.type === 'recap') {                          // rehacer el mismo punto sustituye al anterior
    const k = ns.findIndex(x => x.type === 'recap' && Math.abs(x.pos - n.pos) < 90);
    if (k >= 0) ns.splice(k, 1);
  }
  ns.push(n); ns.sort((a, b) => a.pos - b.pos);
  await dbPut('books', cur);
}
function speechParts(n) {
  if (n.type === 'qa') return [n.q, ...(n.a.match(/[^.!?]+[.!?]*/g) || [n.a])];
  if (n.type === 'mark') return [n.note];
  return [n.data.donde, ...(n.data.temas || []), 'Lo dejaste en: ' + n.data.ultima];
}
function pillBtn(html, label, fn, cls = '') {
  const b = document.createElement('button'); b.className = 'listen ' + cls; b.innerHTML = `${html}<span></span>`;
  b.querySelector('span').textContent = label; b.onclick = fn; return b;
}
function noteCard(n, {title, jump, del} = {}) {
  const box = document.createElement('div'); box.className = 'recap';
  if (title) { const h = document.createElement('div'); h.className = 'hint'; h.style.padding = '0 0 8px'; h.textContent = title; box.append(h); }
  if (n.type === 'qa') {
    const q = document.createElement('p'); q.className = 'q'; q.textContent = n.q;
    const a = document.createElement('p'); a.className = 'a'; a.textContent = n.a;
    box.append(q, a);
  } else if (n.type === 'mark') {
    const a = document.createElement('p'); a.className = 'a'; a.textContent = '🔖 ' + n.note; box.append(a);
  } else {
    const lead = document.createElement('p'); lead.className = 'lead'; lead.textContent = n.data.donde;
    const ul = document.createElement('ul');
    for (const t of n.data.temas || []) { const li = document.createElement('li'); li.textContent = t; ul.append(li); }
    const last = document.createElement('p'); last.className = 'last';
    const b = document.createElement('b'); b.textContent = 'Lo dejaste en'; last.append(b, n.data.ultima);
    box.append(lead, ul, last);
  }
  const meta = document.createElement('p'); meta.className = 'meta' + (jump ? ' go' : '');
  meta.textContent = `${n.chapter ? n.chapter + ' · ' : ''}${fmt(n.pos)}${n.min ? (n.whole ? ` · capítulo desde el inicio (${n.min} min)` : ` · últimos ${n.min} min`) : ''}${n.date ? ' · ' + ago(Date.now() - n.date) : ''}${jump ? ' · ir aquí' : ''}`;
  if (jump) meta.onclick = () => { audio.currentTime = n.pos; closeSheet(); };
  box.append(meta);
  const acts = document.createElement('div'); acts.className = 'acts';
  if ('speechSynthesis' in window) {
    const btn = pillBtn(ICON_SPEAK, n.type === 'qa' ? 'Escuchar respuesta' : n.type === 'mark' ? 'Escuchar' : 'Escuchar resumen', null);
    const idle = () => { btn.innerHTML = ICON_SPEAK + '<span></span>'; btn.querySelector('span').textContent = n.type === 'qa' ? 'Escuchar respuesta' : n.type === 'mark' ? 'Escuchar' : 'Escuchar resumen'; };
    btn.onclick = () => speakParts(speechParts(n), btn, idle);
    acts.append(btn);
  }
  if (del) acts.append(pillBtn('', 'Borrar', del, 'danger'));
  if (acts.children.length) box.append(acts);
  return box;
}
const recapCard = (r, title) => noteCard({type: 'recap', ...r}, {title});

/* lectura en voz alta, con la voz del propio móvil (gratis y sin conexión) */
const ICON_SPEAK = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>';
let speaking = null;                          // {btn, idle} del botón que está hablando
function stopSpeaking() {
  try { speechSynthesis.cancel(); } catch {}
  if (speaking) { speaking.idle(); speaking = null; }
}
function speakParts(parts, btn, idle) {
  const ss = window.speechSynthesis;
  const was = speaking?.btn === btn;
  stopSpeaking();
  if (was) return;
  audio.pause();
  const voices = ss.getVoices().filter(v => /^es/i.test(v.lang));
  const voice = voices.find(v => /es[-_]ES/i.test(v.lang) && v.localService) || voices.find(v => /es[-_]ES/i.test(v.lang)) || voices[0] || null;
  // una frase por locución: algunos móviles cortan las locuciones largas
  parts = parts.map(t => (t || '').trim()).filter(Boolean);
  const done = () => { if (speaking?.btn === btn) { speaking = null; idle(); } };
  parts.forEach((t, k) => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = voice ? voice.lang : 'es-ES'; if (voice) u.voice = voice;
    u.onerror = done;
    if (k === parts.length - 1) u.onend = done;
    ss.speak(u);
  });
  speaking = {btn, idle}; btn.innerHTML = ICON_STOP + '<span>Parar</span>';
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

/* hoja de apuntes: por capítulos, con copiar / compartir */
function noteItems(b) {
  const marks = (b.marks || []).filter(m => m.note).map(m => ({type: 'mark', pos: m.t, chapter: m.chapter, note: m.note, date: m.date, ref: m}));
  return [...notesOf(b), ...marks].sort((x, y) => x.pos - y.pos);
}
function notesText(b) {
  const out = [`Apuntes de «${b.title}»${b.artist ? ' — ' + b.artist : ''}`, `Exportado el ${new Date().toLocaleDateString('es')}`, ''];
  let ch = null;
  for (const n of noteItems(b)) {
    if (n.chapter !== ch) { ch = n.chapter; out.push('', `== ${ch || 'Sin capítulo'} ==`); }
    if (n.type === 'qa') out.push(`[${fmt(n.pos)}] Pregunta: ${n.q}`, `   ${n.a}`);
    else if (n.type === 'mark') out.push(`[${fmt(n.pos)}] Marcador: ${n.note}`);
    else out.push(`[${fmt(n.pos)}] ${n.data.donde}`, ...(n.data.temas || []).map(t => `   • ${t}`), `   → Lo dejaste en: ${n.data.ultima}`);
  }
  return out.join('\n');
}
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type})); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function openNotes(b = cur) {
  const items = noteItems(b);
  sheet(`Apuntes (${items.length})`, body => {
    if (!items.length) {
      const h = document.createElement('div'); h.className = 'hint';
      h.textContent = 'Aún no hay apuntes. Cada resumen y cada pregunta que hagas se guardan aquí, ordenados por capítulo, junto con los marcadores que tengan nota.';
      return body.append(h);
    }
    const acts = document.createElement('div'); acts.className = 'chips';
    const copy = document.createElement('button'); copy.className = 'chip'; copy.textContent = 'Copiar todo';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(notesText(b)); toast('Apuntes copiados'); } catch { toast('No se pudo copiar'); } };
    const share = document.createElement('button'); share.className = 'chip'; share.textContent = navigator.share ? 'Compartir' : 'Descargar .txt';
    share.onclick = async () => {
      const text = notesText(b);
      if (navigator.share) { try { await navigator.share({title: 'Apuntes · ' + b.title, text}); } catch {} }
      else download(`Apuntes - ${b.title.slice(0, 60)}.txt`, text, 'text/plain');
    };
    acts.append(copy, share); body.append(acts);
    let ch = null;
    for (const n of items) {
      if (n.chapter !== ch) { ch = n.chapter; const h = document.createElement('div'); h.className = 'chaph'; h.textContent = ch || 'Sin capítulo'; body.append(h); }
      body.append(noteCard(n, {
        jump: cur && cur.id === b.id,
        del: async () => {
          if (n.type === 'mark') n.ref.note = ''; else b.notes.splice(b.notes.indexOf(n), 1);
          await dbPut('books', b); openNotes(b);
        }
      }));
    }
  });
}

function keyForm(body, after) {
  const h = document.createElement('div'); h.className = 'hint';
  h.innerHTML = 'Los resúmenes y las preguntas los hace Claude, la IA de Anthropic, leyendo el texto del libro. ' +
    'Pega aquí tu clave de API: se crea en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API keys</a> ' +
    '(empieza por «sk-ant-»). Se guarda solo en este móvil. Cada resumen o pregunta cuesta unos céntimos de tu saldo de Anthropic.';
  const i = document.createElement('input'); i.className = 'text'; i.type = 'password'; i.placeholder = 'Pega aquí tu clave (sk-ant-…)';
  i.autocomplete = 'off'; i.value = getKey();
  const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'Guardar clave';
  ok.onclick = () => { const k = i.value.trim(); if (!k) return toast('Pega la clave primero'); setKey(k); toast('Clave guardada'); after(); };
  body.append(h, i, ok);
}

/* ---------- texto del libro (EPUB) ---------- */
let epubTarget = null, epubAfter = null;
function pickEpub(book, after) { epubTarget = book; epubAfter = after; $('#epubFile').click(); }
$('#epubFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  const b = epubTarget; if (!f || !b) return;
  toast('Leyendo el EPUB…', 60000);
  try {
    const tx = await parseEpub(f);
    await dbPut('texts', {id: b.id, ...tx});
    b.hasText = tx.name; b.textAnchors = []; await dbPut('books', b);
    const matched = textAnchors(b, tx).length - 2;
    toast(`Texto añadido: ${tx.chapters.length} capítulos en el EPUB` + (b.chapters?.length ? `, ${Math.max(0, matched)} ${Math.max(0, matched) === 1 ? 'enlazado' : 'enlazados'} con el audio` : ''), 4500);
    epubAfter?.();
  } catch (err) { console.error(err); toast('No se pudo leer: ' + err.message, 5000); }
};
function needTextSheet(after) {
  sheet('Falta el texto del libro', body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = 'Claude no puede escuchar el audio, así que lee el texto del libro. Añade el EPUB de este mismo libro: ' +
      'la app buscará la parte que corresponde a donde vas. Solo hace falta una vez por libro.';
    const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'Elegir el EPUB del libro';
    ok.onclick = () => pickEpub(cur, after);
    body.append(h, ok);
  });
}
/* ajuste fino: eliges el párrafo que estabas oyendo y la app lo usa como referencia */
async function openTextAlign(b = cur) {
  const tx = await bookText(b.id);
  if (!tx) return needTextSheet(() => openTextAlign(b));
  const t = audio.currentTime, est = textOffsetAt(b, tx, t);
  const paras = []; let p = 0;
  for (const s of tx.text.split('\n')) { if (s.trim().length > 1) paras.push({off: p, s}); p += s.length + 1; }
  let k = paras.findIndex(x => x.off > est); k = (k < 0 ? paras.length : k) - 1;
  sheet('¿Qué estabas oyendo?', body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = `Toca el párrafo que estabas oyendo en ${fmt(t)}. Marcado en color: donde la app cree que vas. Con cada ajuste la posición se vuelve más precisa.`;
    body.append(h);
    for (let j = Math.max(0, k - 7); j <= Math.min(paras.length - 1, k + 4); j++) {
      const r = row(paras[j].s.length > 160 ? paras[j].s.slice(0, 160) + '…' : paras[j].s, async () => {
        b.textAnchors = (b.textAnchors || []).filter(a => Math.abs(a.t - t) > 30);
        b.textAnchors.push({t, off: paras[j].off + Math.round(paras[j].s.length / 2)});
        await dbPut('books', b); toast('Posición ajustada'); closeSheet();
      }, j === k ? 'cur' : '');
      r.style.fontSize = '14px'; r.style.lineHeight = '1.4';
      body.append(r);
    }
    if (b.textAnchors?.length) body.append(row(`Borrar mis ajustes (${b.textAnchors.length})`, async () => { b.textAnchors = []; await dbPut('books', b); toast('Ajustes borrados'); closeSheet(); }, 'danger'));
  });
  setTimeout(() => $('#sheetBody .cur')?.scrollIntoView({block: 'center'}), 60);
}
function textMenu(b) {
  sheet('Texto del libro', body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = b.hasText ? `EPUB: ${b.hasText}. Claude lo usa para resumir y responder.` : 'Este libro aún no tiene texto. Añade su EPUB para usar los resúmenes y las preguntas.';
    body.append(h, row(b.hasText ? 'Cambiar el EPUB' : 'Añadir el EPUB', () => pickEpub(b, closeSheet)));
    if (b.hasText) body.append(
      row('Ajustar la posición en el texto', () => { if (!cur || cur.id !== b.id) return toast('Abre el libro primero'); openTextAlign(b); }),
      row('Quitar el texto', async () => { await dbDel('texts', b.id); b.hasText = ''; b.textAnchors = []; await dbPut('books', b); toast('Texto quitado'); closeSheet(); }, 'danger'));
  });
}

/* ejecuta una petición a Claude mostrando el progreso y, si falla, el motivo */
async function runAI(body, task, onDone, retry) {
  if (recapBusy) return;
  recapBusy = true;
  const wasPlaying = !audio.paused; audio.pause();
  body.innerHTML = '<div class="busy"><i></i><span></span></div>';
  const status = body.querySelector('.busy span');
  try {
    const res = await task(t => status.textContent = t);
    if (!$('#sheet')) return;
    body.innerHTML = ''; onDone(res);
  } catch (e) {
    console.error(e);
    if (e.needText) return needTextSheet(retry);
    if (!$('#sheet')) return;
    body.innerHTML = '';
    const h = document.createElement('div'); h.className = 'hint'; h.style.color = 'var(--danger)';
    h.textContent = e.badKey ? e.message + '. Vuelve a pegarla.' : 'No se pudo completar: ' + e.message;
    body.append(h);
    if (e.badKey) keyForm(body, retry); else body.append(row('Reintentar', retry));
    if (wasPlaying) audio.play().catch(() => {});
  } finally { recapBusy = false; }
}
function continueBtn() {
  const cont = document.createElement('button'); cont.className = 'primary'; cont.textContent = 'Seguir escuchando';
  cont.onclick = () => { closeSheet(); audio.play().catch(() => {}); };
  return cont;
}
const alignRow = () => row('¿No coincide con lo que oíste? Ajustar posición', () => openTextAlign(cur));

function openRecap() {
  if (!cur) return;
  $('#awayPill').classList.add('hidden');
  if (!getKey()) return sheet('Clave de Anthropic', b => keyForm(b, openRecap));
  if (!cur.hasText) return needTextSheet(openRecap);
  sheet('¿Dónde me quedé?', body => {
    const r = cur.recap, fresh = r && Math.abs(r.pos - audio.currentTime) < 90;
    if (fresh) body.append(recapCard(r));
    const wrap = document.createElement('div'); wrap.className = 'chips';
    const go = document.createElement('button'); go.className = 'primary';
    const label = () => go.textContent = `${fresh ? 'Rehacer' : 'Resumir'} los últimos ${recapSpan} min`;
    for (const m of [5, 10, 20]) {
      const c = document.createElement('button'); c.className = 'chip' + (m === recapSpan ? ' on' : ''); c.textContent = m + ' min';
      c.onclick = () => { recapSpan = m; wrap.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); label(); };
      wrap.append(c);
    }
    label();
    go.onclick = () => runAI(body, st => makeRecap(recapSpan, st), res => body.append(recapCard(res), continueBtn(), alignRow()), openRecap);
    body.append(wrap, go);
    if (!r && 'speechSynthesis' in window) {
      const h = document.createElement('div'); h.className = 'hint';
      h.textContent = 'Cuando se genere el resumen, debajo tendrás el botón «Escuchar resumen» para oírlo en voz alta.';
      body.append(h);
    }
    if (r && !fresh) body.append(recapCard(r, 'Resumen anterior'));
    body.append(row('Preguntar al libro', openAsk), row(`Apuntes del libro (${noteItems(cur).length})`, () => openNotes(cur)),
      row('Texto del libro y ajuste de posición', () => textMenu(cur)),
      row('Clave de Anthropic', () => sheet('Clave de Anthropic', b => keyForm(b, openRecap))));
  });
}

/* ---------- preguntar al libro: Claude lee el capítulo actual desde su inicio hasta donde vas ---------- */
const NO_CHAPTER_MINUTES = 30;                // libros sin capítulos: últimos 30 min
const ASK_SYSTEM = 'Respondes preguntas de alguien que está escuchando un audiolibro. Recibes el texto del libro desde el inicio del capítulo actual hasta donde va el oyente; ' +
  'la marca [POSICIÓN ESTIMADA DEL OYENTE] señala aproximadamente dónde lo dejó y lo que sigue es solo margen: no adelantes contenido posterior. ' +
  'Si la pregunta habla de «esto» o «lo último», se refiere a lo que hay justo antes de la marca. ' +
  'Responde en español, claro y directo, en un máximo de unas 150 palabras y sin formato markdown. Básate en el texto; si completas con conocimiento general del tema, dilo. Si la respuesta no está en el texto, indícalo.';
async function askBook(question, onStatus) {
  onStatus('Buscando en el libro el capítulo actual…');
  const tx = await bookText(cur.id);
  if (!tx) throw Object.assign(new Error('Este libro aún no tiene su EPUB.'), {needText: true});
  const t1 = audio.currentTime, i = chapterIndex(t1), chap = i >= 0 ? chapters()[i].title : '';
  let t0 = i >= 0 ? chapters()[i].start : t1 - NO_CHAPTER_MINUTES * 60;
  t0 = Math.max(0, Math.min(t0, t1 - 180));     // al menos 3 min, aunque el capítulo acabe de empezar
  const mins = Math.max(1, Math.round((t1 - t0) / 60)), whole = i >= 0 && t0 === chapters()[i].start;
  const ctx = notesOf(cur).filter(n => n.type === 'recap' && n.pos < t0).slice(-2).map(n => n.data.donde).join(' ');
  const content = [
    // el texto va primero y se cachea: varias preguntas seguidas en el mismo punto salen más baratas
    {type: 'text', text: `<fragmento>\n${excerpt(tx, textOffsetAt(cur, tx, t0), textOffsetAt(cur, tx, t1), 600, mins)}\n</fragmento>`, cache_control: {type: 'ephemeral'}},
    {type: 'text', text: `Libro: «${cur.title}»${cur.artist ? ` (${cur.artist})` : ''}. ` +
      (whole ? `El fragmento es el capítulo «${chap}» desde su inicio (${mins} min de escucha).` : `El fragmento son los últimos ${mins} minutos de escucha.`) + '\n' +
      (ctx ? `Contexto de capítulos anteriores: ${ctx}\n` : '') + `Pregunta: «${question}»`}];
  onStatus(`Claude está leyendo ${mins} min del capítulo y pensando la respuesta…`);
  const data = await askClaude(ASK_SYSTEM, content, ANSWER_SCHEMA);
  const note = {type: 'qa', pos: t1, chapter: chap, date: Date.now(), q: question, a: data.respuesta, min: mins, whole};
  await addNote(note);
  return note;
}
function openAsk() {
  if (!cur) return;
  if (!getKey()) return sheet('Clave de Anthropic', b => keyForm(b, openAsk));
  if (!cur.hasText) return needTextSheet(openAsk);
  sheet('Preguntar al libro', body => {
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = (chapters() ? 'Claude lee el capítulo actual desde su inicio hasta donde vas' : `Claude lee lo equivalente a los últimos ${NO_CHAPTER_MINUTES} minutos`) +
      ' y te responde. La respuesta se guarda en tus apuntes.';
    const {field, input} = textField('Escribe o dicta tu pregunta…');
    const sug = document.createElement('div'); sug.className = 'chips';
    for (const t of ['Explícamelo más sencillo', 'Ponme un ejemplo práctico', '¿Cuál es la idea principal?', '¿Qué significa este concepto?']) {
      const c = document.createElement('button'); c.className = 'chip'; c.textContent = t;
      c.onclick = () => { input.value = t; input.focus(); };
      sug.append(c);
    }
    const go = document.createElement('button'); go.className = 'primary'; go.textContent = 'Preguntar';
    go.onclick = () => {
      const q = input.value.trim(); if (!q) return toast('Escribe o dicta una pregunta');
      runAI(body, st => askBook(q, st), n => {
        body.append(noteCard(n));
        const again = document.createElement('button'); again.className = 'primary'; again.style.background = 'var(--surface2)'; again.style.color = 'var(--text)';
        again.textContent = 'Hacer otra pregunta'; again.onclick = openAsk;
        body.append(again, continueBtn(), alignRow());
      }, openAsk);
    };
    body.append(h, field, sug, go);
    const prev = notesOf(cur).filter(n => n.type === 'qa').slice(-3).reverse();
    if (prev.length) { const t = document.createElement('div'); t.className = 'chaph'; t.textContent = 'Preguntas recientes'; body.append(t); prev.forEach(n => body.append(noteCard(n))); }
  });
}
